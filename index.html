<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHWP</title>
    <link rel="stylesheet" href="style.css">
    <style>html.auth-pending body { visibility: hidden; }</style>
    <script>document.documentElement.classList.add('auth-pending');</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
</head>
<body class="main-page">
    <header class="site-header home-header">
        <a class="brand-link" href="index.html">WHWP</a>
        <nav class="site-nav" aria-label="Основная навигация">
            <a href="index.html" class="nav-link active">Главная</a>
            <a href="write.html" class="nav-link">Записать</a>
            <a href="find.html" class="nav-link">Узнать</a>
            <a href="statistics.html" class="nav-link">Статистика</a>
            <a href="grades.html" class="nav-link">Оценки</a>
            <a href="schedule.html" class="nav-link">Расписание</a>
            <a href="calendar.html" class="nav-link">Календарь</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Включить тёмную тему" title="Тёмная тема">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"></path>
            </svg>
            <svg class="theme-icon theme-icon-moon is-hidden" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"></path>
            </svg>
        </button>
        <button class="logout-btn" type="button" data-logout>Выйти</button>
    </header>

    <div class="pixel-decoration top-left"></div>
    <div class="pixel-decoration top-right"></div>
    <div class="pixel-decoration bottom-left"></div>
    <div class="pixel-decoration bottom-right"></div>

    <div class="pixel-grid"></div>

    <div class="pixel-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
    </div>

    <div class="container">
        <div class="logo-container">
            <div class="logo-icon">
                <svg width="80" height="80" viewBox="0 0 80 80">
                    <rect x="10" y="10" width="60" height="60" fill="none" stroke="#9AF064" stroke-width="4"/>
                    <rect x="20" y="20" width="40" height="40" fill="none" stroke="#9AF064" stroke-width="3"/>
                    <circle cx="40" cy="40" r="10" fill="#9AF064"/>
                </svg>
            </div>
            <h1 class="main-title">WHWP</h1>
        </div>

        <div class="main-buttons">
            <a href="write.html" class="btn btn-large">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg>
                Записать
            </a>
            <a href="find.html" class="btn btn-large">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9a4 4 0 1 1 6.8 2.8c-1.2 1.1-2.8 1.8-2.8 3.7M12 19h.01"></path></svg>
                Узнать
            </a>
            <div class="home-extra-links">
                <a href="statistics.html" class="text-link">Статистика</a>
                <a href="grades.html" class="text-link">Оценки</a>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
