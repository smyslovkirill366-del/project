<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь заданий - WHWP</title>
    <link rel="stylesheet" href="style.css">
    <style>html.auth-pending body { visibility: hidden; }</style>
    <script>document.documentElement.classList.add('auth-pending');</script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="brand-link" href="index.html">WHWP</a>
        <nav class="site-nav" aria-label="Основная навигация">
            <a href="index.html" class="nav-link">Главная</a>
            <a href="write.html" class="nav-link">Записать</a>
            <a href="find.html" class="nav-link">Узнать</a>
            <a href="statistics.html" class="nav-link">Статистика</a>
            <a href="grades.html" class="nav-link">Оценки</a>
            <a href="schedule.html" class="nav-link">Расписание</a>
            <a href="calendar.html" class="nav-link active">Календарь</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Включить тёмную тему" title="Тёмная тема">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"></path></svg>
            <svg class="theme-icon theme-icon-moon is-hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 1 0 20 15.5Z"></path></svg>
        </button>
        <button class="logout-btn" type="button" data-logout>Выйти</button>
    </header>

    <main class="standalone-page calendar-page">
        <div class="page-heading">
            <a href="index.html" class="btn back-btn">Назад</a>
            <h1 id="calendar-month-title" class="section-title">Календарь заданий</h1>
            <button id="refresh-calendar-btn" class="btn today-btn" type="button">Обновить</button>
        </div>

        <div class="calendar-legend">
            <span><i class="legend-dot priority-urgent"></i>Срочно</span>
            <span><i class="legend-dot priority-medium"></i>Средне</span>
            <span><i class="legend-dot priority-later"></i>Потом</span>
        </div>

        <section class="calendar-panel stat-panel">
            <div class="calendar-weekdays">
                <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
            </div>
            <div id="calendar-grid" class="calendar-grid"></div>
        </section>

        <section class="calendar-tasks stat-panel">
            <h2 id="selected-date-title" class="section-title">Выберите день</h2>
            <div id="calendar-task-list" class="calendar-task-list">
                <p class="empty-state">Нажмите на день, чтобы увидеть задания.</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
